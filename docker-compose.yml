services:
  tracker:
    build: .
    container_name: dsa-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Leave empty to auto-generate + persist a secret in ./server/data/jwt_secret.
      # Or set a long random value: JWT_SECRET=$(openssl rand -hex 32)
      JWT_SECRET: ${JWT_SECRET:-}
      DATA_DIR: /app/server/data
    volumes:
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
